name: FitTrack Pro CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test & Build Pipeline
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # Backend Test & Validation
      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Backend Syntax & Unit Tests
        working-directory: ./server
        env:
          MONGODB_URI: mongodb://localhost:27017/fittrack_pro_ci
          JWT_SECRET: ci_test_secret_key_12345
          PORT: 5000
        run: npm test

      # Frontend Build
      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Frontend Application (Vite Production)
        working-directory: ./client
        run: npm run build

      # Docker Validation
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: fittrack-server:ci

      - name: Build Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: fittrack-client:ci

